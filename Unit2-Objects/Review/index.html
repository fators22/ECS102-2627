<title>Static vs Instance — Objects &amp; Methods Drills</title>
<!--
  OBJECTS & METHODS DRILLS (Java). Open in any browser - iPad Safari included.
  Every program is generated fresh. Its answer is computed in JavaScript and
  checked against real Java (javac + java) for every runnable template.
  Scope: creating objects, constructors, method signatures, static (class)
  vs instance methods/variables, void vs non-void methods.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>

  --ink:#F3F6FA; --grid:#E2E9F2; --wire:#C3D0E1; --chalk:#101A2B; --dim:#4A5B74;

  --btn-ink:#101A2B; --btn-go:#5ADB8C; --btn-amber:#F2B705;
  --mono:'Cascadia Mono','IBM Plex Mono',Consolas,'Courier New',monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink:#101A2B; --grid:#1E2F47; --wire:#2B3F5F; --chalk:#EAF0F7; --dim:#AEC0D8;
    --signal:#ED225D; --amber:#F2B705; --go:#5ADB8C; --chipbg:rgba(43,63,95,.35);
  }
}

  --ink:#101A2B; --grid:#1E2F47; --wire:#2B3F5F; --chalk:#EAF0F7; --dim:#AEC0D8;

}

*, *::before, *::after { box-sizing: border-box; }

                    linear-gradient(90deg, var(--grid) 1px, transparent 1px);

}

}

@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

.panel { border: 1px solid #333; border-radius: 9px; overflow: hidden; background: #1E1E1E; }

textarea {
  width: 100%; min-height: 170px; resize: vertical; border: 0; outline: none;

}

.out .none { color: #8494AB; font-style: italic; }
.out .err { color: #FF8FA8; }
.tip { margin-top: 12px; border-left: 5px solid var(--btn-amber); background: rgba(242,183,5,.12);
       padding: 11px 16px; border-radius: 0 8px 8px 0; font-size: 17px; }
.tip b { display: block; font: 600 12px/1 var(--mono); color: var(--amber); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 5px; }
footer { margin-top: 22px; color: var(--dim); font-size: 14px; text-align: center; }

<body>
<div class="wrap">

<header>
  <div>
    <span class="eyebrow">AP CSA · Reteach</span>
    <h1>Static vs Instance</h1>
  </div>
  <div class="score">
    <div class="chip" id="streakChip"><b id="streak">0</b><span>streak</span></div>
    <div class="chip"><b id="best">0</b><span>best</span></div>
    <div class="chip"><b id="tally">0/0</b><span>right</span></div>
  </div>
</header>

<div class="topics" id="topics">
  <button data-t="mixed" class="on">Mixed</button>
  <button data-t="objects">Objects</button>
  <button data-t="static">Static</button>
  <button data-t="returns">void / return</button>
  <button data-t="signatures">Signatures</button>
</div>

<div class="grid">
  <div class="panel">
    <div class="tabbar">
      <span class="tab active"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="4" fill="#E76F00"/><path d="M13.5 6v8.2c0 2.3-1.4 3.6-3.6 3.6-1.2 0-2.2-.4-2.9-1.1l1.1-1.6c.5.5 1.1.8 1.7.8.8 0 1.4-.5 1.4-1.8V6h2.3z" fill="#fff"/></svg>Main.java<span class="x">&times;</span></span>
      <span class="tag" id="topicTag"></span>
    </div>
    <div class="body" id="code"></div>
  </div>

  <div>
    <div class="panel answer-panel" id="answerPanel">
      <div class="tabbar pane"><span class="tab active ask" id="ask">What prints?</span></div>
      <div class="askcode" id="askcode"></div>
      <textarea id="answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        placeholder="Type exactly what prints.&#10;One value per line.&#10;Won't compile or crashes? Type: error"></textarea>
    </div>
    <div class="actions">
      <button class="primary" id="check">Check</button>
      <button class="ghost" id="error">Error</button>

  </div>
</div>

<div class="feedback" id="feedback">
  <p class="verdict" id="verdict"></p>
  <div class="panel">
    <div class="tabbar pane"><span class="tab">Problems</span><span class="tab active" id="outLabel">Terminal</span></div>
    <div class="out" id="out"></div>
  </div>
  <div class="tip" id="tip"></div>
</div>

<footer>A new program every time. Get a streak of 10 &mdash; then switch topic.</footer>
</div>

<script>
/* =====================================================================
   OBJECTS & METHODS DRILLS — generator engine (Java).
   Every template returns { code, out, tip, ask?, askCode?, cs?, show?, noRun? }.
   `out` is what Java prints (or ["error"] for compile/runtime errors).
   Runnable templates are verified against real Java by a test harness.
   ===================================================================== */
(function (root) {
  function rng(seed) {                       // mulberry32 - seedable for testing
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const NAMES = ["Ana", "Ben", "Kai", "Mia", "Leo", "Zoe", "Raj", "Ivy", "Sam", "Noa"];
  const PETS  = ["Rex", "Milo", "Luna", "Coco", "Bolt", "Nala"];
  const I = n => "    ".repeat(n);
  const P = x => `System.out.println(${x});`;
  const jd = x => Number.isInteger(x) ? x.toFixed(1) : String(x);   // Java double printing

  function classBlock(name, lines) {
    return [`class ${name} {`, ...lines.map(l => I(1) + l), "}"];
  }
  function mainWrap(lines, helpers) {
    const out = ["public class Main {"];
    if (helpers) { helpers.forEach(l => out.push(I(1) + l)); out.push(""); }
    out.push(I(1) + "public static void main(String[] args) {");
    lines.forEach(l => out.push(I(2) + l));
    out.push(I(1) + "}", "}");
    return out;
  }
  const program = (cls, mainLines, helpers) =>
    (cls ? [...cls, ""] : []).concat(mainWrap(mainLines, helpers)).join("\n");

  const COUNTER = [
    "private int count;",
    "public Counter(int start) {", "    count = start;", "}",
    "public void add(int n) {", "    count = count + n;", "}",
    "public int getCount() {", "    return count;", "}",
  ];

  function make(R) {
    const int  = (lo, hi) => lo + Math.floor(R() * (hi - lo + 1));
    const pick = arr => arr[Math.floor(R() * arr.length)];
    const coin = () => R() < 0.5;
    const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    const T = {
      /* ---------------- objects: new, constructors, instance state ---------------- */
      o_ctor() {
        const w = int(2, 9), h = int(2, 9), per = coin();
        const m = per ? "getPerimeter" : "getArea";
        const code = program(classBlock("Box", [
          "private int w;", "private int h;",
          "public Box(int w, int h) {", "    this.w = w;", "    this.h = h;", "}",
          `public int ${m}() {`, `    return ${per ? "2 * (w + h)" : "w * h"};`, "}",
        ]), [`Box b = new Box(${w}, ${h});`, P(`b.${m}()`)]);
        return { code, out: [per ? 2 * (w + h) : w * h],
                 tip: "new Box(...) calls the constructor, which stores the arguments in the object's instance variables. The method then works with those stored values." };
      },
      o_two() {
        const s1 = int(0, 5), s2 = int(0, 5), x = int(1, 9), y = int(1, 9), z = int(1, 9);
        const code = program(classBlock("Counter", COUNTER), [
          `Counter a = new Counter(${s1});`, `Counter b = new Counter(${s2});`,
          `a.add(${x});`, `b.add(${y});`, `a.add(${z});`,
          P("a.getCount()"), P("b.getCount()"),
        ]);
        return { code, out: [s1 + x + z, s2 + y],
                 tip: "a and b are two separate objects - each has its OWN count. Calling a.add(...) never touches b." };
      },
      o_alias() {
        const s = int(0, 5), x = int(1, 9), y = int(1, 9), alias = coin();
        const code = program(classBlock("Counter", COUNTER), [
          `Counter a = new Counter(${s});`, alias ? "Counter b = a;" : `Counter b = new Counter(${s});`,
          `b.add(${x});`, `a.add(${y});`, P("a.getCount()"), P("b.getCount()"),
        ]);
        return alias
          ? { code, out: [s + x + y, s + x + y], tip: "Counter b = a; does NOT create an object. b and a are two names for the SAME object, so every add shows up through both. Only new creates an object." }
          : { code, out: [s + y, s + x], tip: "Two uses of new = two separate objects. They start with the same value but change independently." };
      },
      o_default() {
        const C = pick(["Coin", "Card", "Ticket", "Badge"]), first = coin();
        const code = program(classBlock(C, [
          "private int value;", "private String label;",
          "public int getValue() {", "    return value;", "}",
          "public String getLabel() {", "    return label;", "}",
        ]), [`${C} c = new ${C}();`, P(first ? "c.getValue()" : "c.getLabel()"), P(first ? "c.getLabel()" : "c.getValue()")]);
        return { code, out: first ? ["0", "null"] : ["null", "0"],
                 tip: "No constructor is written, so Java supplies an empty one. Instance variables nobody sets get defaults: 0 for int, null for objects like String." };
      },
      o_shadow() {
        const v = int(2, 9), bug = coin();
        const code = program(classBlock("Box", [
          "private int w;",
          "public Box(int w) {", bug ? "    w = w;" : "    this.w = w;", "}",
          "public int getW() {", "    return w;", "}",
        ]), [`Box b = new Box(${v});`, P("b.getW()")]);
        return bug
          ? { code, out: [0], tip: "Inside the constructor, w means the PARAMETER. w = w copies the parameter onto itself, so the instance variable stays at its default 0. Fix: this.w = w;" }
          : { code, out: [v], tip: "this.w is the instance variable; plain w is the parameter. this.w = w; stores the argument in the object." };
      },
      o_setter() {
        const w = int(2, 6), h = int(2, 6), n = int(2, 9);
        const code = program(classBlock("Box", [
          "private int w;", "private int h;",
          "public Box(int w, int h) {", "    this.w = w;", "    this.h = h;", "}",
          "public void setW(int newW) {", "    w = newW;", "}",
          "public int getArea() {", "    return w * h;", "}",
        ]), [`Box b = new Box(${w}, ${h});`, P("b.getArea()"), `b.setW(${n});`, P("b.getArea()")]);
        return { code, out: [w * h, n * h],
                 tip: "setW is a void mutator: it changes the object's state and returns nothing. The second getArea() sees the new w." };
      },
      o_null() {
        const x = int(1, 9), made = coin(), s = int(0, 5);
        const code = program(classBlock("Counter", COUNTER), [
          made ? `Counter c = new Counter(${s});` : "Counter c = null;", `c.add(${x});`, P("c.getCount()"),
        ]);
        return made
          ? { code, out: [s + x], tip: "new Counter(...) creates the object, so c refers to something real and the methods run normally." }
          : { code, out: ["error"], show: 'Exception in thread "main" java.lang.NullPointerException',
              tip: "c holds null - it refers to NO object, because new was never called. Calling a method on null crashes at run time." };
      },

      /* ---------------- static: class methods & shared variables ---------------- */
      st_call() {
        const f = pick([["triple", "n * 3", n => n * 3], ["square", "n * n", n => n * n], ["addTen", "n + 10", n => n + 10]]);
        const a = int(2, 9), b = int(2, 4);
        const code = program(classBlock("Calc", [
          `public static int ${f[0]}(int n) {`, `    return ${f[1]};`, "}",
        ]), [P(`Calc.${f[0]}(${a})`), P(`Calc.${f[0]}(Calc.${f[0]}(${b}))`)]);
        return { code, out: [f[2](a), f[2](f[2](b))],
                 tip: `${f[0]} is static - a class method. It is called on the CLASS name (Calc.${f[0]}), no object needed. The inner call's return value becomes the outer call's argument.` };
      },
      st_count() {
        const k = int(2, 4), j = int(1, k);
        const lines = [];
        for (let i = 1; i <= k; i++) lines.push(`Player p${i} = new Player();`);
        lines.push(P(`p${j}.getId()`), P("Player.getCount()"));
        const code = program(classBlock("Player", [
          "private static int count = 0;", "private int id;",
          "public Player() {", "    count++;", "    id = count;", "}",
          "public int getId() {", "    return id;", "}",
          "public static int getCount() {", "    return count;", "}",
        ]), lines);
        return { code, out: [j, k],
                 tip: "count is static: ONE copy shared by every Player, so it keeps climbing. id is an instance variable: each Player keeps its own copy of what count was when it was made." };
      },
      st_shared() {
        const x = int(1, 9), y = int(1, 9), isStatic = coin();
        const code = program(classBlock("Team", [
          isStatic ? "private static int score;" : "private int score;",
          "public void addPoints(int p) {", "    score = score + p;", "}",
          "public int getScore() {", "    return score;", "}",
        ]), ["Team a = new Team();", "Team b = new Team();", `a.addPoints(${x});`, `b.addPoints(${y});`, P("a.getScore()"), P("b.getScore()")]);
        return isStatic
          ? { code, out: [x + y, x + y], tip: "score is static - there is ONE score for the whole class. Both objects add to the same variable, so both report the total." }
          : { code, out: [x, y], tip: "score is an instance variable - every Team gets its own. a and b each keep their own points." };
      },
      st_math() {
        const opts = [
          () => { const n = int(2, 9); return [`Math.abs(-${n})`, String(n)]; },
          () => { const a = int(2, 5), e = int(2, 3); return [`Math.pow(${a}, ${e})`, jd(Math.pow(a, e))]; },
          () => { const r = int(2, 9); return [`Math.sqrt(${r * r})`, jd(r)]; },
          () => { const a = int(1, 9), b = int(10, 19); return coin() ? [`Math.max(${a}, ${b})`, String(b)] : [`Math.min(${b}, ${a})`, String(a)]; },
        ];
        const [i1, i2] = shuffle([0, 1, 2, 3]);
        const A = opts[i1](), B = opts[i2]();
        return { code: program(null, [P(A[0]), P(B[0])]), out: [A[1], B[1]],
                 tip: "Math methods are static - called on the class: Math.name(...). Math.pow and Math.sqrt return double (so you see .0). abs, max and min with int arguments return int." };
      },
      st_target() {
        const w = int(2, 9), bad = coin();
        const code = program(classBlock("Box", [
          "private int w;",
          "public Box(int w) {", "    this.w = w;", "}",
          "public int getW() {", "    return w;", "}",
        ]), [`Box b = new Box(${w});`, P(bad ? "Box.getW()" : "b.getW()")]);
        return bad
          ? { code, out: ["error"], show: "error: non-static method getW() cannot be referenced from a static context",
              tip: "getW is an instance method - it needs a specific Box object. Call it on the object (b.getW()). Only static methods are called on the class name." }
          : { code, out: [w], tip: "getW is an instance method called on the object b - correct. It returns b's own w." };
      },
      st_context() {
        const name = pick(PETS), bad = coin();
        const code = program(classBlock("Dog", [
          "private String name;",
          "public Dog(String n) {", "    name = n;", "}",
          bad ? "public static String getName() {" : "public String getName() {", "    return name;", "}",
        ]), [`Dog d = new Dog("${name}");`, P("d.getName()")]);
        return bad
          ? { code, out: ["error"], show: "error: non-static variable name cannot be referenced from a static context",
              tip: "A static method belongs to the class, not to any one Dog - so it has no name to read. Static methods cannot use instance variables." }
          : { code, out: [name], tip: "getName is an instance method, so it can read this Dog's name." };
      },

      /* ---------------- void vs non-void (return) ---------------- */
      r_ignored() {
        const f = pick([["doubleIt", "n * 2", n => n * 2], ["addFive", "n + 5", n => n + 5], ["half", "n / 2", n => Math.trunc(n / 2)]]);
        const a = int(3, 9);
        const code = program(null, [`int x = ${a};`, `${f[0]}(x);`, P("x"), `x = ${f[0]}(x);`, P("x")],
          [`public static int ${f[0]}(int n) {`, `    return ${f[1]};`, "}"]);
        return { code, out: [a, f[2](a)],
                 tip: `${f[0]}(x); on its own throws the returned value away - x does not change. x = ${f[0]}(x); STORES the return value.` };
      },
      r_void() {
        const g = pick(["Hi", "Hello", "Bye"]), [n1, n2] = shuffle(NAMES);
        const code = program(null, [`greet("${n1}");`, `greet("${n2}");`],
          ["public static void greet(String name) {", `    System.out.println("${g} " + name);`, "}"]);
        return { code, out: [`${g} ${n1}`, `${g} ${n2}`],
                 tip: "greet is void - it returns nothing. Its output comes from the println INSIDE it, which runs once per call." };
      },
      r_voiderr() {
        const n = int(2, 9), v = pick([0, 1, 2]);
        const line = [P(`show(${n})`), `int r = show(${n});`, `show(${n});`][v];
        const code = program(null, [line], ["public static void show(int n) {", "    System.out.println(n);", "}"]);
        if (v === 0) return { code, out: ["error"], show: "error: 'void' type not allowed here",
          tip: "show is void, so there is no value to hand to println. You can only print a method's result if it returns something." };
        if (v === 1) return { code, out: ["error"], show: "error: incompatible types: void cannot be converted to int",
          tip: "show is void - it returns nothing, so there is nothing to store in r." };
        return { code, out: [n], tip: "A void method is called as a statement on its own. The println inside it does the printing." };
      },
      r_both() {
        const a = int(2, 9), store = coin();
        const code = program(null, store ? [`int r = show(${a});`, P('"out " + r')] : [`show(${a});`, P('"done"')],
          ["public static int show(int n) {", '    System.out.println("in " + n);', "    return n + 1;", "}"]);
        return { code, out: store ? [`in ${a}`, `out ${a + 1}`] : [`in ${a}`, "done"],
                 tip: store ? "Printing and returning are different jobs. The println inside show runs during the call; the return value only appears because main prints r."
                            : "The println inside show runs during the call. The returned value is never stored or printed, so it just disappears." };
      },
      r_intdiv() {
        let a = int(2, 9), b = int(2, 9); if ((a + b) % 2 === 0) b++;
        const dbl = coin();
        const code = program(null, [P(`avg(${a}, ${b})`)],
          ["public static double avg(int a, int b) {", `    return (a + b) / ${dbl ? "2.0" : "2"};`, "}"]);
        return { code, out: [dbl ? jd((a + b) / 2) : jd(Math.trunc((a + b) / 2))],
                 tip: dbl ? "Dividing by 2.0 makes it double division, so the .5 is kept."
                          : "(a + b) / 2 is int / int, so the decimal is chopped first. THEN it is returned as a double - that's why you see .0." };
      },
      r_chain() {
        const a = int(1, 9), b = int(1, 9), c = int(2, 5), v = coin();
        const code = program(null, v ? [`int r = add(add(${a}, ${b}), ${c});`, P("r")] : [P(`add(${a}, ${b}) * ${c}`)],
          ["public static int add(int x, int y) {", "    return x + y;", "}"]);
        return { code, out: [v ? a + b + c : (a + b) * c],
                 tip: "A non-void call can be used anywhere a value fits. Work inside-out: replace each call with the value it returns." };
      },
      r_string() {
        const [w1, w2] = shuffle(["hey", "yo", "go", "wow", "nice"]), v = coin();
        const code = program(null, [P(v ? `shout("${w1}") + shout("${w2}")` : `shout(shout("${w1}"))`)],
          ["public static String shout(String w) {", '    return w + "!";', "}"]);
        return { code, out: [v ? `${w1}!${w2}!` : `${w1}!!`],
                 tip: "shout returns a String. Each call is replaced by its returned value, then + joins the Strings." };
      },

      /* ---------------- signatures: reading method headers ---------------- */
      g_sig() {
        const C = pick(["Pet", "Student", "Player", "Member"]), v = C[0].toLowerCase();
        const POOL = [
          { h: "public String getName()", n: "getName", ret: "String", ps: [], st: false },
          { h: "public void setName(String n)", n: "setName", ret: "void", ps: ["String"], st: false },
          { h: "public int getAge()", n: "getAge", ret: "int", ps: [], st: false },
          { h: "public void addYears(int y)", n: "addYears", ret: "void", ps: ["int"], st: false },
          { h: "public boolean isOlder(int age)", n: "isOlder", ret: "boolean", ps: ["int"], st: false },
          { h: "public void rename(String first, String last)", n: "rename", ret: "void", ps: ["String", "String"], st: false },
          { h: "public static int countAll()", n: "countAll", ret: "int", ps: [], st: true },
          { h: "public static boolean isValid(int age)", n: "isValid", ret: "boolean", ps: ["int"], st: true },
          { h: "public static double average(int a, int b, int c)", n: "average", ret: "double", ps: ["int", "int", "int"], st: true },
          { h: "public static String describe(String s, int k)", n: "describe", ret: "String", ps: ["String", "int"], st: true },
        ];
        const ctor = { h: `public ${C}(String name, int age)`, n: C, ret: null, ps: ["String", "int"], st: false, ctor: true };
        const methods = shuffle(POOL).slice(0, 4);
        const all = methods.slice(); all.splice(int(0, 4), 0, ctor);
        const code = [`public class ${C} {`, ...all.map(m => I(1) + m.h + " { ... }"), "}"].join("\n");
        const lit = t => t === "int" ? String(int(1, 20)) : t === "String" ? `"${pick(NAMES)}"` : t === "double" ? "2.5" : "true";
        const badLit = t => t === "int" ? `"${int(1, 9)}"` : t === "String" ? String(int(1, 9)) : "\"yes\"";
        const callOn = (m, args) => `${m.st ? C : v}.${m.n}(${args.join(", ")})`;
        const make = `${C} ${v} = new ${C}("${pick(NAMES)}", ${int(10, 17)});`;
        const m = pick(methods);
        const kind = pick(["ret", "ret", "params", "static", "static", "ctor", "store", "store", "call", "call"]);

        if (kind === "ret") return { code, noRun: true, cs: true, ask: `What is the return type of ${m.n}?`, out: [m.ret],
          tip: `The return type is the word right before the method name.${m.ret === "void" ? " void means the method returns nothing." : ""} Java is case-sensitive: String has a capital S.` };
        if (kind === "params") { const t = pick([m, ctor]);
          return { code, noRun: true, ask: `How many parameters does ${t.ctor ? "the constructor" : t.n} take?`, out: [t.ps.length],
            tip: "Count the declarations inside the parentheses - each parameter is a type followed by a name." }; }
        if (kind === "static") return { code, noRun: true, ask: `Is ${m.n} a static or an instance method?`, out: [m.st ? "static" : "instance"],
          tip: m.st ? `The header says static, so it is a class method - call it as ${C}.${m.n}(...).` : `No static in the header, so it is an instance method - call it on an object, like ${v}.${m.n}(...).` };
        if (kind === "ctor") return { code, noRun: true, ask: "Which line number is the constructor?", out: [all.indexOf(ctor) + 2],
          tip: "A constructor has the SAME name as the class and NO return type - not even void." };
        if (kind === "store") return { code, noRun: true, cs: m.ret !== "void", ask: "What type goes in the blank? (Type error if nothing can be stored.)",
          askCode: `${make}\n_____ r = ${callOn(m, m.ps.map(lit))};`,
          out: [m.ret === "void" ? "error" : m.ret], show: m.ret === "void" ? `${m.n} is void - there is no value to store.` : null,
          tip: m.ret === "void" ? "A void method returns nothing, so its call can't be assigned to a variable." : `The variable's type must match the return type in the header: ${m.ret}.` };
        // which call compiles?
        const good = callOn(m, m.ps.map(lit));
        const wrongs = [];
        wrongs.push(callOn(m, m.ps.length ? m.ps.slice(1).map(lit) : ["5"]));                      // wrong number of args
        if (m.ps.length) wrongs.push(callOn(m, m.ps.map((t, i) => i === 0 ? badLit(t) : lit(t))));  // wrong type
        wrongs.push(m.st ? `${m.n}(${m.ps.map(lit).join(", ")})` : `${C}.${m.n}(${m.ps.map(lit).join(", ")})`); // wrong target
        const opts = shuffle([good, ...shuffle(wrongs).slice(0, 2)]);
        const letter = "ABC"[opts.indexOf(good)];
        return { code, noRun: true, ask: "Which call compiles? Type A, B or C.",
          askCode: `// in main (another class):\n${make}\nA: ${opts[0]};\nB: ${opts[1]};\nC: ${opts[2]};`, out: [letter],
          tip: `Match the header exactly: ${m.ps.length} argument(s) of type ${m.ps.join(", ") || "(none)"}, called on ${m.st ? "the class name " + C : "an object like " + v}.` };
      },
    };

    const TOPICS = {
      objects:    ["o_ctor", "o_two", "o_alias", "o_default", "o_shadow", "o_setter", "o_null"],
      static:     ["st_call", "st_count", "st_shared", "st_math", "st_target", "st_context"],
      returns:    ["r_ignored", "r_void", "r_voiderr", "r_both", "r_intdiv", "r_chain", "r_string"],
      signatures: ["g_sig", "g_sig", "g_sig", "g_sig", "g_sig"],
    };
    TOPICS.mixed = [].concat(TOPICS.objects, TOPICS.static, TOPICS.returns, TOPICS.signatures);
    const LABEL = { o: "objects", s: "static", r: "void / return", g: "signatures" };

    function generate(topic, forceKey) {
      const key = forceKey || pick(TOPICS[topic] || TOPICS.mixed);
      const q = T[key]();
      q.key = key; q.topic = LABEL[key[0]];
      q.out = q.out.map(String);
      return q;
    }
    return { generate, TOPICS, templates: Object.keys(T) };
  }

  /* whitespace tokens: forgiving of iPad typing, strict on content */
  function tokens(s, cs) {
    let t = String(s).trim();
    if (!cs) t = t.toLowerCase();
    if (/^(nothing|none|\(nothing\))$/i.test(t) || t === "") return [];
    return t.split(/\s+/);
  }
  function check(answer, out, cs) {
    if (out.length === 1 && out[0] === "error") return /\b(error|exception|crash)/i.test(answer) || /^error$/i.test(String(answer).trim());
    const a = tokens(answer, cs), b = out.join(" ").trim() === "" ? [] : out.join(" ").split(/\s+/).map(x => cs ? x : x.toLowerCase());
    return a.length === b.length && a.every((x, i) => x === b[i]);
  }

  const api = { rng, make, check, tokens };
  if (typeof module !== "undefined") module.exports = api; else root.MethodDrills = api;
})(this);
</script>
<script>
(function () {
  var eng = MethodDrills.make(Math.random);
  var topic = "mixed", q = null, answered = false;
  var stats = { streak: 0, best: 0, right: 0, total: 0 };
  try { stats.best = +localStorage.getItem("methodDrillsBest") || 0; } catch (e) {}

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function colour(line) {
    var cm = line.indexOf("//");
    if (cm === 0 || (cm > 0 && line.slice(0, cm).split('"').length % 2 === 1)) {
      return (cm > 0 ? colour(line.slice(0, cm)) : "") + '<span class="cm">' + esc(line.slice(cm)) + "</span>";
    }
    var s = esc(line);
    s = s.replace(/("[^"]*")/g, '\u0001$1\u0002');
    var outside = '(?![^\u0001]*\u0002)';
    s = s.replace(new RegExp('\\b(public|private|static|void|class|new|return|this|null|int|double|boolean|true|false)\\b' + outside, 'g'), '<span class="kw">$1</span>');
    s = s.replace(new RegExp('\\b(String|System|Math|Main|Box|Counter|Player|Team|Calc|Dog|Coin|Card|Ticket|Badge|Pet|Student|Member)\\b' + outside, 'g'), '<span class="ty">$1</span>');
    s = s.replace(/(^|[^\w"#.])(-?\d+(?:\.\d+)?)(?![\w"])/g, '$1<span class="nu">$2</span>');
    return s.replace(/\u0001("[^"]*")\u0002/g, '<span class="st">$1</span>');
  }
  function lines(code) {
    return code.split("\n").map(function (l, i) {
      return '<div class="ln"><span class="num">' + (i + 1) + '</span><span>' + colour(l) + '</span></div>';
    }).join("");
  }
  function render() {
    q = eng.generate(topic);
    document.getElementById("code").innerHTML = lines(q.code);
    document.getElementById("topicTag").textContent = q.topic;
    document.getElementById("ask").textContent = q.ask || "What prints?";
    document.getElementById("askcode").innerHTML = q.askCode ? q.askCode.split("\n").map(colour).join("\n") : "";
    var a = document.getElementById("answer"); a.value = ""; a.disabled = false;
    a.placeholder = q.ask ? "Type your answer." : "Type exactly what prints.\nOne value per line.\nWon't compile or crashes? Type: error";
    document.getElementById("answerPanel").className = "panel answer-panel";
    document.getElementById("feedback").className = "feedback";
    document.getElementById("check").disabled = false;
    document.getElementById("error").disabled = false;
    document.getElementById("outLabel").textContent = q.ask ? "Answer" : "Terminal";
    answered = false;
  }
  function paint() {
    document.getElementById("streak").textContent = stats.streak;
    document.getElementById("best").textContent = stats.best;
    document.getElementById("tally").textContent = stats.right + "/" + stats.total;
    document.getElementById("streakChip").className = "chip" + (stats.streak >= 5 ? " hot" : "");
  }
  function check() {
    if (answered) return;
    var given = document.getElementById("answer").value;
    if (!given.trim()) { document.getElementById("answer").focus(); return; }
    answered = true;
    var ok = MethodDrills.check(given, q.out, q.cs);
    stats.total++;
    if (ok) { stats.right++; stats.streak++; if (stats.streak > stats.best) stats.best = stats.streak; }
    else stats.streak = 0;
    try { localStorage.setItem("methodDrillsBest", stats.best); } catch (e) {}
    paint();

    var v = document.getElementById("verdict");
    v.textContent = ok ? "Correct" + (stats.streak >= 3 ? " \u2014 " + stats.streak + " in a row" : "")
                       : (q.ask ? "Not quite \u2014 here's the answer" : "Not quite \u2014 here's what really happens");
    v.className = "verdict " + (ok ? "right" : "wrong");
    document.getElementById("answerPanel").className = "panel answer-panel " + (ok ? "right" : "wrong");

    var html;
    if (q.out.length === 1 && q.out[0] === "error") {
      html = '<span class="err">' + esc(q.show || "error") + "</span>";
    } else {
      var norm = function (x) { return q.cs ? x : x.toLowerCase(); };
      var mine = MethodDrills.tokens(given, q.cs), real = q.out.join(" ").split(/\s+/);
      var firstBad = -1;
      for (var i = 0; i < Math.max(mine.length, real.length); i++) {
        if ((mine[i] || "") !== norm(real[i] || "")) { firstBad = i; break; }
      }
      var n = 0;
      html = q.out.map(function (line) {
        return line.split(" ").map(function (tok) {
          var cls = (!ok && n === firstBad) ? ' class="miss"' : ""; n++;
          return "<span" + cls + ">" + esc(tok) + "</span>";
        }).join(" ");
      }).join("\n");
    }
    document.getElementById("out").innerHTML = html;
    document.getElementById("tip").innerHTML = "<b>Why</b>" + esc(q.tip);
    document.getElementById("feedback").className = "feedback show";
    document.getElementById("check").disabled = true;
    document.getElementById("error").disabled = true;
    document.getElementById("answer").disabled = true;
  }

  document.getElementById("check").onclick = check;
  document.getElementById("next").onclick = render;
  document.getElementById("error").onclick = function () { document.getElementById("answer").value = "error"; check(); };
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); answered ? render() : check(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll("#topics button"), function (b) {
    b.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll("#topics button"), function (x) { x.classList.remove("on"); });
      b.classList.add("on"); topic = b.getAttribute("data-t"); stats.streak = 0; paint(); render();
    };
  });
  paint(); render();
})();
</script>
</body>
</html>
